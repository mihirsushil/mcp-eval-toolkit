[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-eval-toolkit"
version = "0.1.0"
description = "Reproducible MCP behavioral evaluation experiments"
requires-python = ">=3.13"
dependencies = ["mcp>=1.25,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "pydantic>=2.12,<3", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15"]

[project.scripts]
mcp-eval = "mcp_eval_toolkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
